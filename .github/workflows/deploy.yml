# ============================================================
# pf-payroll — Cloud Run deploy pipeline
# ============================================================
#
# ONE-TIME GCP SETUP (run once per project, not part of CI):
#
#   # 1. Enable required APIs
#   gcloud services enable \
#     run.googleapis.com \
#     artifactregistry.googleapis.com \
#     sqladmin.googleapis.com \
#     secretmanager.googleapis.com \
#     cloudbuild.googleapis.com
#
#   # 2. Create Artifact Registry repository
#   #    NOTE: do NOT enable containerscanning.googleapis.com — this keeps
#   #    vulnerability scanning disabled and avoids ~$5/month in scan fees.
#   gcloud artifacts repositories create pf-payroll \
#     --repository-format=docker \
#     --location=us-central1 \
#     --description="pf-payroll container images"
#
#   # 3. Create the DATABASE_URL secret in Secret Manager
#   #    Cloud SQL Unix socket format:
#   #      postgresql+asyncpg://<USER>:<PASSWORD>@/pf_db?host=/cloudsql/PROJECT:REGION:pf-db
#   echo -n "postgresql+asyncpg://<USER>:<PASSWORD>@/pf_db?host=/cloudsql/<PROJECT>:us-central1:pf-db" | \
#     gcloud secrets create PF_DATABASE_URL --data-file=-
#
#   # 4. Create service account and grant IAM roles
#   gcloud iam service-accounts create pf-payroll \
#     --display-name="pf-payroll GitHub Actions deployer"
#
#   SA="pf-payroll@<PROJECT>.iam.gserviceaccount.com"
#
#   for ROLE in \
#     roles/run.admin \
#     roles/artifactregistry.writer \
#     roles/cloudsql.client \
#     roles/secretmanager.secretAccessor \
#     roles/iam.serviceAccountUser; do
#     gcloud projects add-iam-policy-binding <PROJECT> \
#       --member="serviceAccount:${SA}" --role="${ROLE}"
#   done
#
#   # 5. Create and export the SA JSON key → add as GCP_SA_KEY GitHub secret
#   gcloud iam service-accounts keys create sa-key.json --iam-account="${SA}"
#   # Upload sa-key.json contents to GitHub secret GCP_SA_KEY, then delete the file.
#   rm sa-key.json
#
#   # 6. Grant SA access to the DATABASE_URL secret
#   gcloud secrets add-iam-policy-binding PF_DATABASE_URL \
#     --member="serviceAccount:${SA}" \
#     --role="roles/secretmanager.secretAccessor"
#
#   # 7. Create the PF_RATES_API_KEY secret (API key to call pf-rates service)
#   echo -n "<STRONG_RANDOM_KEY>" | \
#     gcloud secrets create PF_RATES_API_KEY --data-file=-
#
#   gcloud secrets add-iam-policy-binding PF_RATES_API_KEY \
#     --member="serviceAccount:${SA}" \
#     --role="roles/secretmanager.secretAccessor"
#
#   # 8. Create the PF_PAYROLL_API_KEY secret (API key clients must supply to call this service)
#   echo -n "<STRONG_RANDOM_KEY>" | \
#     gcloud secrets create PF_PAYROLL_API_KEY --data-file=-
#
#   gcloud secrets add-iam-policy-binding PF_PAYROLL_API_KEY \
#     --member="serviceAccount:${SA}" \
#     --role="roles/secretmanager.secretAccessor"
#
# Required GitHub Secrets:
#   GCP_SA_KEY                      — service account JSON key (base64 or raw JSON)
#   GCP_PROJECT_ID                  — GCP project ID
#   GCP_CLOUD_SQL_INSTANCE          — (optional) Cloud SQL instance for proxy sidecar
#   PF_RATES_URL                    — Cloud Run URL of the deployed pf-rates service
#   GH_PAT                          — (optional) GitHub PAT for private repo access
#   MAIL_SERVER                     — SMTP server hostname (e.g. smtp.gmail.com)
#   MAIL_PORT                       — SMTP port (e.g. 587)
#   MAIL_USERNAME                   — SMTP username
#   MAIL_PASSWORD                   — SMTP password or app-specific password
#   MAIL_FROM                       — Sender address (e.g. pf-payroll CI <you@example.com>)
#   MAIL_TO                         — Recipient address(es), comma-separated
#
# Secret Manager Secrets (auto-injected by reusable workflow):
#   PF_DATABASE_URL                 — Database connection string
#   PF_RATES_API_KEY                — API key for calling pf-rates service
#   PF_PAYROLL_API_KEY              — API key for this service
#
# Manual approval setup (one-time, GitHub UI):
#   1. Go to Settings → Environments → New environment → name it "production"
#   2. Enable "Required reviewers" and add yourself (or your team)
#   The "gate" job pauses there; deploy only runs after approval.
#
# For more details, see docs/deployment.md
#
# ============================================================

name: CI / Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # required for SARIF upload to GitHub Security

jobs:
  deploy:
    uses: mrturo-pf/pf-common/.github/workflows/deploy-reusable.yml@main
    with:
      repo_name: pf-payroll
    secrets: inherit
