[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pf-payroll"
version = "0.1.0"
description = "Chilean payroll modular monolith"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30",
  "fastapi>=0.116",
  "greenlet>=3.2",
  "holidays>=0.74",
  "httpx>=0.28",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.11",
  "pypdf>=5.0",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36,<2.1",  # 2.1.0 changed Row[...] generic typing and breaks
  # mypy in reference_data_repository.py -- bump only after auditing that file's
  # Row[tuple[...]] annotations against the new release.
  "structlog>=25.4",
  "typer>=0.16",
  "uvicorn[standard]>=0.35",
  "weasyprint>=66.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.5",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "respx>=0.22",
  "ruff==0.15.22",
  "testcontainers[postgres]>=4.12",
  "vulture>=2.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
  "error",
  # starlette.testclient imports anyio.abc.BlockingPortal, which anyio itself
  # deprecated in favor of anyio.from_thread.BlockingPortal. This is a
  # third-party library internal, not something we can fix here.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
  # weasyprint warns when the optional HarfBuzz-Subset native library isn't
  # installed; test_..._without_native_libs deliberately exercises that path.
  "ignore:HarfBuzz-Subset will be required by future versions of WeasyPrint.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["D", "E", "W", "UP"]
ignore = [
  "B008",    # FastAPI Depends() in function defaults is the correct pattern
  "DTZ001",  # datetime() without tzinfo is acceptable in tests
  "DTZ011",  # date.today() is acceptable when timezone-naive dates are needed
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"

[tool.vulture]
paths = ["src"]
min_confidence = 80
sort_by_size = true

[[tool.mypy.overrides]]
module = ["pandas", "weasyprint"]
ignore_missing_imports = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# By default setuptools only bundles .py files belonging to discovered
# packages -- non-code data files under a package directory (here, the
# versioned payroll-PDF-template JSON files loaded by
# infrastructure/pdf_import/templates.py) are silently dropped from a
# regular `pip install .` build unless declared here. This bit everyone
# during local dev, since `pip install -e .` (editable) keeps files in
# place on disk and never exhibited the bug -- only the Docker image's
# non-editable `pip install .` did, in production, on Cloud Run.
[tool.setuptools.package-data]
"payroll.infrastructure.pdf_import" = ["templates/**/*.json"]
